      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#e8b020" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C9960C" stop-opacity="0.15"/>
    </radialGradient>
    <clipPath id="windowClipFinal">
      <rect x="210" y="224" width="260" height="190" rx="8"/>
