<svg width="500" height="500" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Leicester Oven Cleaning icon</title>
  <desc>A front-on geometric oven icon in Leicester Blue with Rich Gold accents, LOC LCD display, four dials, and warm corner-lit inner glow. Transparent background.</desc>
