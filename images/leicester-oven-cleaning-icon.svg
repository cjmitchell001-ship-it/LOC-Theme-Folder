  <text x="184" y="158" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#e8b020">LOC</text>

  <circle cx="290" cy="152" r="11" fill="#1A3A6E" stroke="#C9960C" stroke-width="2"/>
  <circle cx="290" cy="152" r="5" fill="#C9960C"/>
  <circle cx="350" cy="152" r="11" fill="#1A3A6E" stroke="#C9960C" stroke-width="2"/>
  <circle cx="350" cy="152" r="5" fill="#C9960C"/>
  <circle cx="410" cy="152" r="11" fill="#1A3A6E" stroke="#C9960C" stroke-width="2"/>
